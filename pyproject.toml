[project]
name = "trading-maxxing"
version = "0.1.0"
description = "Workspace de Python de trading_maxxing"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "respx>=0.22",
    "fakeredis>=2.26",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
tm-shared = { workspace = true }
tm-marketdata = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
# Scripts de diagramas y del board: utilidades sueltas, fuera del lint
extend-exclude = ["docs/propuesta", "scripts/board"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["packages", "services"]

[tool.coverage.run]
source = ["packages/shared/src", "packages/marketdata/src", "services/api/src", "services/agents/src", "services/forecast/src", "services/engine/src"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_empty = true
