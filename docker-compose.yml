# Motor de trading_maxxing para DESARROLLO local (build local de las imágenes).
#
#   cd apps/api && pnpm dev   # la API en wrangler dev: http://localhost:8787 (D1 local)
#   make motor-local          # redis + agents + engine + forecast apuntando a wrangler dev
#   make web                  # frontend con hot reload en http://localhost:3000
#
# Ya no hay Supabase ni la API de FastAPI: todo lo persistente vive en D1 detrás del Worker
# (apps/api). El motor la alcanza en host.docker.internal:8787 con el SERVICE_TOKEN de
# apps/api/.dev.vars. Para correr el motor "de verdad" en la Mac con las imágenes de Docker
# Hub, usa docker-compose.runner.yml (make runner-up).

name: trading-maxxing

x-python-service: &python-service
  env_file:
    - path: .env
      required: false
  environment:
    REDIS_URL: redis://redis:6379/0
    FORECAST_URL: ${FORECAST_URL:-http://forecast:8001}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # API en wrangler dev (apps/api: pnpm dev). Mismo token que SERVICE_TOKEN de .dev.vars.
    TM_API_URL: ${TM_API_URL:-http://host.docker.internal:8787}
    TM_SERVICE_TOKEN: ${TM_SERVICE_TOKEN:-dev-service-token-cambiame}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Orquestador (#19) y ledger de referencia (#57) en un solo worker. La capa compartida
  # (señales, vetos y SimulationGate, una vez para todos) publica en tm:signals; la capa por
  # usuario (un BotRunner por bot en running) lee tm:signals y los comandos de la API
  # (GET /internal/commands) y publica en tm:decisions; el ReferenceService lee el mismo
  # tm:signals con su propio cursor. Se pueden separar con ORCHESTRATOR_SHARED=0 /
  # ORCHESTRATOR_BOTS=0 / REFERENCE_SERVICE=0.
  agents:
    <<: *python-service
    image: trading-maxxing-agents:local
    build: { context: ., dockerfile: services/agents/Dockerfile }
    environment:
      REDIS_URL: redis://redis:6379/0
      FORECAST_URL: ${FORECAST_URL:-http://forecast:8001}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TM_API_URL: ${TM_API_URL:-http://host.docker.internal:8787}
      TM_SERVICE_TOKEN: ${TM_SERVICE_TOKEN:-dev-service-token-cambiame}
      TM_DATA_DIR: /app/data/bars
      ORCHESTRATOR_SYMBOLS: ${ORCHESTRATOR_SYMBOLS:-BTCUSDT,ETHUSDT}
      ORCHESTRATOR_SHARED: ${ORCHESTRATOR_SHARED:-1}
      ORCHESTRATOR_BOTS: ${ORCHESTRATOR_BOTS:-1}
      REFERENCE_SERVICE: ${REFERENCE_SERVICE:-1}
    volumes: ["./data:/app/data:ro"]

  # NautilusTrader: fills a /internal/trades, latido y backtests encolados de la API.
  engine:
    <<: *python-service
    image: trading-maxxing-engine:local
    build: { context: ., dockerfile: services/engine/Dockerfile }
    volumes: ["./data:/app/data:ro"]

  # Perfil "forecast-docker": se apaga con `make up-mps` para correr Kronos nativo con MPS.
  forecast:
    <<: *python-service
    profiles: ["forecast-docker"]
    image: trading-maxxing-forecast:local
    build: { context: ., dockerfile: services/forecast/Dockerfile }
    ports: ["127.0.0.1:8001:8001"]
    environment:
      FORECAST_DEVICE: cpu
      HF_HOME: /app/.cache/huggingface
    volumes: [hf-cache:/app/.cache/huggingface]

  # Perfil "web": frontend en contenedor (build de producción). Para desarrollar usa `make web`.
  web:
    profiles: ["web"]
    image: trading-maxxing-web:local
    build: { context: apps/web }
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped

volumes:
  redis-data:
  hf-cache:
