# Motor de trading_maxxing para DESARROLLO local (build local de las imágenes).
#
#   make dev        # API (wrangler dev) + web (next dev) + este compose con la demo y ejecución sim
#   make dev-down   # apaga todo
#
# Guía paso a paso: docs/correr-local.md. Todo lo persistente vive en D1 detrás del Worker
# (apps/api): el motor lo alcanza en host.docker.internal:8787 con el SERVICE_TOKEN de
# apps/api/.dev.vars. Para el motor "de verdad" en la Mac con las imágenes de Docker Hub usa
# docker-compose.runner.yml (make runner-up).
#
# Perfiles:
#   (ninguno)  redis + agents + engine. Es lo que levanta `make dev`.
#   forecast   Kronos-small en CPU (PyTorch, imagen pesada). Opcional: ninguna estrategia del
#              seed local lo necesita. `make dev FORECAST=1` o COMPOSE_PROFILES=forecast.

name: trading-maxxing

x-python-service: &python-service
  env_file:
    - path: .env
      required: false
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

# Variables comunes de agents y engine (cada servicio las repite: `environment` no se mezcla).
x-motor-env: &motor-env
  REDIS_URL: redis://redis:6379/0
  FORECAST_URL: ${FORECAST_URL:-http://forecast:8001}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # API en wrangler dev (apps/api). Mismo token que SERVICE_TOKEN de apps/api/.dev.vars.
  TM_API_URL: ${TM_API_URL:-http://host.docker.internal:8787}
  TM_SERVICE_TOKEN: ${TM_SERVICE_TOKEN:-dev-service-token-cambiame}
  # Velas históricas en parquet (data/bars, ver docs/final/setup-local.md §7); lo que falte se
  # pide a la REST pública de Binance.
  TM_DATA_DIR: /app/data/bars

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Orquestador (#19) y ledger de referencia (#57) en un solo worker. La capa compartida
  # (señales, vetos y SimulationGate, una vez para todos) publica en tm:signals; la capa por
  # usuario (un BotRunner por bot en running) lee tm:signals y los comandos de la API
  # (GET /internal/commands) y publica en tm:decisions; el ReferenceService lee el mismo
  # tm:signals con su propio cursor.
  agents:
    <<: *python-service
    image: trading-maxxing-agents:local
    build: { context: ., dockerfile: services/agents/Dockerfile }
    environment:
      <<: *motor-env
      ORCHESTRATOR_SYMBOLS: ${ORCHESTRATOR_SYMBOLS:-BTCUSDT,ETHUSDT}
      ORCHESTRATOR_SHARED: ${ORCHESTRATOR_SHARED:-1}
      ORCHESTRATOR_BOTS: ${ORCHESTRATOR_BOTS:-1}
      REFERENCE_SERVICE: ${REFERENCE_SERVICE:-1}
      # Solo demo local: estrategia demo_pulse (long/flat cada N minutos en velas de 1 min).
      # `make dev` la prende; en dev y prod (docker-compose.runner.yml) no existe.
      TM_DEMO_STRATEGY: ${TM_DEMO_STRATEGY:-0}
      TM_DEMO_PULSE_MINUTES: ${TM_DEMO_PULSE_MINUTES:-2}
      # Foto de equity de cada bot (la curva del dashboard); 300 s en la nube.
      EQUITY_SNAPSHOT_SECONDS: ${EQUITY_SNAPSHOT_SECONDS:-60}
      COMMANDS_POLL_SECONDS: ${COMMANDS_POLL_SECONDS:-3}
    volumes: ["./data:/app/data:ro"]

  # Ejecución: Binance Spot Testnet con BINANCE_TESTNET_API_KEY/SECRET en .env; sin ellas,
  # ENGINE_EXECUTION=auto usa la ejecución simulada (fills al precio público de Binance).
  engine:
    <<: *python-service
    image: trading-maxxing-engine:local
    build: { context: ., dockerfile: services/engine/Dockerfile }
    environment:
      <<: *motor-env
      ENGINE_EXECUTION: ${ENGINE_EXECUTION:-auto}
      ENGINE_SYMBOLS: ${ENGINE_SYMBOLS:-BTCUSDT,ETHUSDT}
    volumes: ["./data:/app/data:ro"]

  # Perfil "forecast": Kronos en CPU. Para correrlo nativo con Metal: make forecast-mps.
  forecast:
    <<: *python-service
    profiles: ["forecast"]
    image: trading-maxxing-forecast:local
    build: { context: ., dockerfile: services/forecast/Dockerfile }
    ports: ["127.0.0.1:8001:8001"]
    depends_on: {}
    environment:
      FORECAST_DEVICE: cpu
      HF_HOME: /app/.cache/huggingface
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes: [hf-cache:/app/.cache/huggingface]

volumes:
  redis-data:
  hf-cache:
