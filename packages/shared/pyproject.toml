[project]
name = "tm-shared"
version = "0.1.0"
description = "Contratos compartidos (Signal, TradeDecision, configuración)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tm_shared"]
