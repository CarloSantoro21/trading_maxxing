[project]
name = "tm-engine"
version = "0.1.0"
description = "Motor de ejecución y backtest sobre NautilusTrader"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tm-shared",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tm_engine"]
