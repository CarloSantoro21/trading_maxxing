[project]
name = "tm-engine"
version = "0.1.0"
description = "Motor de ejecución y backtest sobre NautilusTrader"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tm-shared",
    "tm-marketdata",
    "tm-agents",
    "nautilus_trader==1.231.0",
    "redis>=5.0",
    "httpx>=0.28",
    "pandas>=2.2",
    "numpy>=2.1",
    "matplotlib>=3.9",
]

[tool.uv.sources]
tm-agents = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tm_engine"]
