[project]
name = "tm-api"
version = "0.1.0"
description = "API REST de trading_maxxing (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tm-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "redis>=5.2",
    "pyjwt[crypto]>=2.10",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tm_api"]
