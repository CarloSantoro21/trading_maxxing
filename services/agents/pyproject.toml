[project]
name = "tm-agents"
version = "0.1.0"
description = "Estrategias, orquestador, simulación y riesgo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tm-shared",
    "tm-marketdata",
    "httpx>=0.28",
    "numpy>=2.1",
    "pandas>=2.2",
    "pydantic>=2.9",
    "redis>=5.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tm_agents"]
