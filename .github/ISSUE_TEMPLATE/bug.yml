name: Bug
description: Algo no funciona como debería
labels: []
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Comportamiento observado, con logs o capturas si hay.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué se esperaba
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      value: |
        1. 
    validations:
      required: true
  - type: input
    id: servicio
    attributes:
      label: Servicio afectado
      placeholder: web, api, agents, forecast, engine, infra
