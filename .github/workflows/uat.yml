name: UAT (Playwright contra dev)

# UAT del flujo completo contra el deploy de dev (#28). Ver docs/pipeline-y-ambientes.md.
#
# - Se llama como job dependiente (`workflow_call`) desde backend.yml y frontend.yml,
#   justo DESPUÉS de su deploy a dev. No se usa `workflow_run` porque ese disparador solo
#   lee el workflow de la rama por defecto (main) y la UAT tiene que correr en develop.
# - Corre en el environment `dev`: lee la variable WEB_URL (URL de Pages dev) y los secrets
#   CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET (service token de Cloudflare Access) que
#   Playwright manda como headers para pasar el login de Access.
# - Variables que lee apps/web/tests/e2e/uat.spec.ts: APP_URL, CF_ACCESS_CLIENT_ID,
#   CF_ACCESS_CLIENT_SECRET y EXPECTED_ENV (el badge de ambiente debe decir `dev`). No hay
#   usuario ni contraseña: el login es Cloudflare Access (OTP por correo).
# - Si falla, el run del push a develop queda en rojo y el check "UAT (Playwright)" de ese
#   commit queda en failure; el job "Gate UAT" (uat-gate.yml) del push a main lo lee y
#   bloquea el deploy a prod.
# - El reporte HTML y el JUnit de Playwright se suben como artifact.

on:
  workflow_call:
    inputs:
      app_url:
        description: "URL del front en dev (si se omite, la variable WEB_URL del environment dev)"
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      app_url:
        description: "URL del front en dev (si se omite, la variable WEB_URL del environment dev)"
        required: false
        default: ""

permissions:
  contents: read
  checks: write

jobs:
  uat:
    # El gate a prod busca checks cuyo nombre contenga "UAT (Playwright)": no lo cambies.
    name: UAT (Playwright)
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      APP_URL: ${{ inputs.app_url }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_ENV: dev
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Descubrir client_id del service token (tm-motor-dev)
        working-directory: .
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            cf_client_id=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/service_tokens" \
              | jq -r '.result[]? | select(.name == "tm-motor-dev") | .client_id // empty' 2>/dev/null || true)
            [ -n "$cf_client_id" ] && echo "CF_ACCESS_CLIENT_ID=$cf_client_id" >> "$GITHUB_ENV"
          fi

      - name: Revisar configuración de la UAT
        id: creds
        working-directory: .
        run: |
          missing=()
          [ -z "$APP_URL" ]                 && missing+=("app_url (input del workflow; pasa la URL del front en dev)")
          [ -z "$CF_ACCESS_CLIENT_ID" ]     && missing+=("CF_ACCESS_CLIENT_ID")
          [ -z "$CF_ACCESS_CLIENT_SECRET" ] && missing+=("CF_ACCESS_CLIENT_SECRET")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            msg="Falta configuración para la UAT: ${missing[*]}."
            echo "::warning title=UAT omitida::$msg"
            {
              echo "### UAT omitida"
              echo "$msg"
              echo ""
              echo "Esta corrida salió en verde sin verificar nada. Ver docs/pipeline-y-ambientes.md."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "### UAT contra $APP_URL" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          package_json_file: apps/web/package.json

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Instalar dependencias
        if: steps.creds.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile

      - name: Instalar navegador (chromium)
        if: steps.creds.outputs.ok == 'true'
        run: pnpm exec playwright install --with-deps chromium

      # uat.spec.ts manda el service token de Access en cada petición (extraHTTPHeaders con
      # CF_ACCESS_CLIENT_ID/SECRET) para que Access deje pasar sin el login interactivo. Con
      # APP_URL definido Playwright no levanta ningún servidor local.
      - name: Correr UAT
        if: steps.creds.outputs.ok == 'true'
        run: pnpm e2e:uat

      - name: Resultados de la UAT en la pestaña Checks
        if: ${{ !cancelled() && steps.creds.outputs.ok == 'true' }}
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: apps/web/playwright-report/junit.xml
          check_name: "Pruebas UAT (Playwright)"
          detailed_summary: true
          fail_on_failure: false
          require_tests: false

      - name: Subir reporte de Playwright
        if: ${{ !cancelled() && steps.creds.outputs.ok == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-uat
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14
