name: Deploy web (Cloudflare Pages)

# Publica el export estático de apps/web (out/) en Cloudflare Pages (#45).
# Solo manual: el despliegue en la nube está diferido hasta la entrega final.
# Sin CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID el job construye, avisa y termina en verde.
# Instrucciones para crear la cuenta, el proyecto y los secrets: apps/web/README.md.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Rama de Pages (la rama de producción del proyecto publica en producción)"
        required: false
        default: main

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build y deploy a Pages
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    defaults:
      run:
        working-directory: apps/web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: trading-maxxing
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Revisar credenciales de Cloudflare
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            msg="Faltan los secrets CLOUDFLARE_API_TOKEN y/o CLOUDFLARE_ACCOUNT_ID en el environment production; no se desplegó nada."
            echo "::warning title=Deploy omitido::$msg"
            {
              echo "### Deploy omitido"
              echo "$msg"
              echo "Ver apps/web/README.md (sección Cloudflare Pages)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        working-directory: .

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          package_json_file: apps/web/package.json

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Instalar dependencias
        if: steps.creds.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build estático
        if: steps.creds.outputs.ok == 'true'
        # Variables públicas por entorno: se definen como variables (no secrets) del
        # environment production y Next.js las incrusta en el bundle.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          PAGES_BRANCH: ${{ inputs.branch }}
        run: |
          if ! [[ "$PAGES_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Nombre de rama inválido: $PAGES_BRANCH"
            exit 1
          fi
          for v in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!v}" ]; then
              echo "::warning title=Variable faltante::$v no está definida en el environment production; la app mostrará un aviso de configuración."
            fi
          done
          case "$NEXT_PUBLIC_API_URL" in
            http://*) echo "::warning title=API sin HTTPS::NEXT_PUBLIC_API_URL usa http://; el navegador lo bloqueará como contenido mixto." ;;
          esac
          pnpm build
          pnpm check:export

      - name: wrangler pages deploy
        id: deploy
        if: steps.creds.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: pages deploy out --project-name ${{ env.PAGES_PROJECT }} --branch ${{ inputs.branch }} --commit-dirty=true
