name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Instalar dependencias del workspace
        run: uv sync --all-packages --locked
      - name: Lint
        run: uv run ruff check .
      - name: Formato
        run: uv run ruff format --check .
      - name: Pruebas con cobertura (mínimo 70 %)
        run: uv run pytest --cov --cov-report=term --cov-report=xml
      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python
          path: coverage.xml
          if-no-files-found: ignore

  web:
    # El nombre se conserva por si es un check requerido; también construye el export.
    name: Web (eslint + tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Tipos
        run: pnpm typecheck
      - name: Pruebas
        run: pnpm test
      - name: Export estático (out/)
        run: pnpm build
      - name: Rutas del export
        run: pnpm check:export

  api:
    # API en Cloudflare Workers (Hono + D1), issue #115.
    name: API Worker (tsc + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/api/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Tipos (genera también los reportes del laboratorio)
        run: pnpm typecheck
      - name: Pruebas con cobertura (mínimo 70 %) en el runtime de Workers con D1 local
        run: pnpm test:coverage
      - name: Build del Worker (wrangler deploy --dry-run, sin publicar)
        run: pnpm build
      - name: Publicar cobertura y resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage-y-junit
          path: |
            apps/api/coverage
            apps/api/reports/junit.xml
          if-no-files-found: ignore

  docker:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: api, context: ., dockerfile: services/api/Dockerfile }
          - { service: agents, context: ., dockerfile: services/agents/Dockerfile }
          - { service: forecast, context: ., dockerfile: services/forecast/Dockerfile }
          - { service: engine, context: ., dockerfile: services/engine/Dockerfile }
          - { service: web, context: apps/web, dockerfile: apps/web/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: trading-maxxing-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
