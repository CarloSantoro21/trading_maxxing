# Servidor del export estático (out/) dentro de la imagen Docker.
# Replica lo que hace Cloudflare Pages: /login sirve login.html y lo desconocido, 404.html.
server {
    listen 3000;
    listen [::]:3000;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Usado por el HEALTHCHECK de la imagen.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Recursos con hash en el nombre: se pueden cachear para siempre.
    # (Un add_header dentro de location anula los del server, por eso se repite nosniff.)
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
